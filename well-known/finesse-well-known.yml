generated: '2026-08-12'
method: probed
source: live probes of /.well-known/ on FINESSE hosts (2026-08-12)
note: >-
  FINESSE runs its storefront on Shopify (shop id 23733469261, myshopify handle finesse-us).
  Every document indexed below is served from a FINESSE-controlled host (finesse.us,
  account.finesse.us) and describes the FINESSE store specifically — the UCP merchant profile
  names merchant_name "FINESSE" and merchant_origin "finesse.us"; the OAuth/OIDC metadata points
  at account.finesse.us endpoints. The issuer string is a Shopify-hosted identity provider
  (https://shopify.com/authentication/23733469261) scoped to this one merchant, which is the
  platform-templated case, not a different company's document.
hosts:
  - host: https://finesse.us
    documents:
      - path: /.well-known/ucp
        status: 200
        content_type: application/json
        file: finesse-ucp.json
        note: Universal Commerce Protocol merchant profile (version 2026-04-08).
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: finesse-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        file: finesse-oauth-authorization-server.json
        note: RFC 8414. Byte-identical to the openid-configuration document.
      - path: /.well-known/oauth-protected-resource
        status: 200
        content_type: application/json
        file: finesse-oauth-protected-resource.json
        note: RFC 9728. resource=https://finesse.us, authorization_servers=[account.finesse.us, shopify.com/authentication/23733469261].
      - path: /.well-known/apple-developer-merchantid-domain-association
        status: 200
        content_type: text/plain
