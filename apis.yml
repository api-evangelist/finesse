apis:
- name: FINESSE UCP Commerce MCP API
  description: >-
    Agent-facing commerce endpoint implementing the Universal Commerce Protocol (version 2026-04-08,
    with 2026-01-23 also supported) over MCP/JSON-RPC 2.0. Thirteen tools cover catalog search and
    lookup, product detail, cart create/read/update/cancel, checkout create/read/update/complete/
    cancel, and order retrieval. tools/list is anonymous; tool calls require a self-asserted
    meta.ucp-agent.profile URI, and payment completion requires contemporaneous human buyer
    approval. Money is expressed in ISO 4217 minor units.
  humanURL: https://finesse.us/agents.md
  baseURL: https://finesse.us/api/ucp/mcp
