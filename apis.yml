- name: FINESSE Storefront JSON (read-only)
  description: >-
    Unauthenticated read-only product endpoints that FINESSE documents for agents in its own
    agents.md: a paged product feed at /products.json, per-product and per-collection JSON, product
    search, and a sitemap index. Prices here are decimal strings, unlike the minor-unit integers the
    MCP surface returns. Unversioned, with no published stability guarantee. The baseURL is the site
    root by design and not a marketing placeholder: these endpoints genuinely live at
    https://finesse.us/products.json and https://finesse.us/collections/{handle}/products.json, both
    verified HTTP 200 on 2026-08-12.
  humanURL: https://finesse.us/agents.md
  baseURL: https://finesse.us/
