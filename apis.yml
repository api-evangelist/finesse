aid: finesse
name: FINESSE
description: >-
  FINESSE is a Los Angeles direct-to-consumer womenswear brand, founded in 2018, that positions
  itself as an AI-driven fashion house: proprietary demand-prediction models combined with weekly
  community votes decide which styles get produced and in what quantity, which the company frames as
  an answer to overproduction and fashion waste. It sells dresses, tops, bottoms, jumpsuits,
  outerwear, footwear and accessories in sizes XS-3X. FINESSE publishes no developer API program,
  but its storefront at finesse.us ships a genuine agent surface: a live Universal Commerce Protocol
  merchant profile at /.well-known/ucp, an unauthenticated MCP endpoint at /api/ucp/mcp exposing 13
  catalog, cart, checkout and order tools with full JSON Schema inputs, an /agents.md instruction
  document advertised through a dedicated agentic-discovery sitemap, a mirroring /llms.txt, and
  OAuth 2.0 / OpenID Connect metadata for shopper accounts on account.finesse.us.
