    on 2026-08-12. Tool CALLS require a `meta.ucp-agent.profile` agent-profile URI; a call without
    one is rejected with JSON-RPC error -32001 / invalid_profile_url. Payment completion additionally
    requires contemporaneous buyer approval (see conventions/finesse-conventions.yml). A separate,
    login-gated Shopify Customer Account MCP API is advertised via the
    `customer-account-mcp-api:full` OAuth scope (see scopes/finesse-scopes.yml).
