note: >-
  FINESSE is a direct-to-consumer apparel brand, not an API vendor. It sells clothing to shoppers
  and exposes a commerce endpoint so agents can buy that clothing on a buyer's behalf. There is no
  developer plan, no API tier, no metered pricing page and no paid access of any kind — access to
  the UCP/MCP endpoint and the storefront JSON endpoints is free and anonymous. This is a genuine
  zero, not a missing page: the product being priced is merchandise, and merchandise prices are
  returned per-item by the catalog tools.
